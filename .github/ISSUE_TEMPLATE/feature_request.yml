name: Feature request
description: Suggest a new command, flag, or capability
title: '[feature]: '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! `qr` is used from code, the terminal and by AI
        agents over MCP — the more concrete the workflow, the easier it is to
        evaluate.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: The friction or gap you hit today, from a library, CLI or agent point of view.
      placeholder: When generating codes for print, there's no way to ...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: The option, command, or MCP tool you'd like. Sketch the surface if you can.
      placeholder: |
        qr generate "<url>" --logo ./logo.png   # centre a logo in the code
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways to get the same outcome, and why they fall short.
    validations:
      required: false
